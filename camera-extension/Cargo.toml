[package]
name = "vtube-studio-rs-camera-extension"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "CameraExtension"
path = "src/main.rs"

[dependencies]
objc2 = "0.6.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2", "objc2-core-video"] }
objc2-core-media-io = { version = "0.3.2", default-features = false, features = ["std", "CMIOExtension", "CMIOExtensionDevice", "CMIOExtensionProperties", "CMIOExtensionProvider", "CMIOExtensionStream", "CMIOSampleBuffer", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2", "objc2-io-surface"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSUUID", "NSValue"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
