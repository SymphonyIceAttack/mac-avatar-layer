[app]
runtime_profile = "development"
window_level = "screen_saver"
window_x = 100.0
window_y = 140.0
window_width = 540.0
window_height = 720.0
window_capture_friendly = false

[output]
mode = "window"

[output.internal]
width = 1080.0
height = 1080.0
producer = "none"
manifest_path = "target/internal-output/iosurface.json"
obs_preview_window = false

[model]
path = "public/model/0.model3.json"

[diagnostics]
show = false

[capture.screen_capture_kit]
enabled = true
target_fps = 10
log_interval_seconds = 2.0
stalled_after_seconds = 2.0

[renderer]
disable_masks = false
high_precision_masks = false
# Defaults depend on [app].runtime_profile:
# development => enable_msaa/log_events true, release => false.
# enable_msaa = true
# log_events = true
atlas_mipmaps = false
atlas_anisotropy = 1
debug_texture_mode = "none"
hidden_drawables = []
hidden_parts = []
only_drawables = []
only_parts = []
highlight_drawables = []
highlight_parts = []

[motion]
# idle = "0"
# expression = "smile"
blink_interval = 3.8
blink_duration = 0.18

[input.mouse]
enabled = false
coordinate_space = "screen"
smoothing = 10.0
dead_zone = 0.02
invert_x = false
invert_y = false
eye_x_range = 1.0
eye_y_range = 1.0
angle_x_degrees = 30.0
angle_y_degrees = 22.0
angle_z_degrees = -12.0

[input.microphone]
enabled = false
parameter = "ParamMouthOpenY"
gain = 10.0
noise_gate = 0.008
response_curve = 0.6
smoothing = 18.0
attack = 32.0
release = 10.0
min_open = 0.0
max_open = 1.0

[input.camera]
enabled = false
device = ""
target_fps = 30
pose_mode = "camera_when_available"
smoothing = 12.0
dead_zone = 0.03
invert_x = true
invert_y = false
face_x_offset = 0.0
face_y_offset = 0.0
gaze_x_offset = 0.0
gaze_y_offset = 0.0
roll_offset = 0.0
angle_x_degrees = 30.0
angle_y_degrees = 22.0
angle_z_degrees = 12.0
eye_x_range = 1.0
eye_y_range = 1.0
mouth_enabled = true
mouth_gain = 1.4
mouth_open_offset = 0.0
mouth_min_open = 0.0
mouth_max_open = 1.0
mouth_combine = "max"
blink_from_camera = false
blink_close_threshold = 0.20
blink_open_threshold = 0.38

[overrides]
# mouth_open = 1.0
# mouth_form = 0.0
