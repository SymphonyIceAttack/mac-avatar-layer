[app]
runtime_profile = "release"

[model]
path = "public/model/0.model3.json"

[diagnostics]
show = false

[renderer]
disable_masks = false
high_precision_masks = false
# Build config defaults to lower overhead. Uncomment to force either option.
# enable_msaa = true
# log_events = true
atlas_mipmaps = false
atlas_anisotropy = 1
debug_texture_mode = "none"
hidden_drawables = []
hidden_parts = []
only_drawables = []
only_parts = []
highlight_drawables = []
highlight_parts = []

[motion]
# expression = "smile"
blink_interval = 3.8
blink_duration = 0.18

[input.mouse]
enabled = false
coordinate_space = "screen"
smoothing = 10.0
dead_zone = 0.02
invert_x = false
invert_y = false
eye_x_range = 1.0
eye_y_range = 1.0
angle_x_degrees = 30.0
angle_y_degrees = 22.0
angle_z_degrees = -12.0

[input.microphone]
enabled = false
parameter = "ParamMouthOpenY"
gain = 10.0
noise_gate = 0.008
response_curve = 0.6
smoothing = 18.0
attack = 32.0
release = 10.0
min_open = 0.0
max_open = 1.0

[input.camera]
enabled = false
device = ""
target_fps = 30
smoothing = 12.0
dead_zone = 0.03
invert_x = false
invert_y = false
angle_x_degrees = 30.0
angle_y_degrees = 22.0
angle_z_degrees = 12.0
eye_x_range = 1.0
eye_y_range = 1.0
mouth_enabled = true
mouth_gain = 1.4
mouth_min_open = 0.0
mouth_max_open = 1.0
mouth_combine = "max"
blink_from_camera = false

[overrides]
# mouth_open = 1.0
# mouth_form = 0.0
