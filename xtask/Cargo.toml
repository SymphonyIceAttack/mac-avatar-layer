[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
core-foundation-sys = "0.8"
ctrlc = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
